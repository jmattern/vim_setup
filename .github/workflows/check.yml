name: setup checks and standards

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.21.0'
      - name: Pin npm version
        run: npm install --global npm@11.19.0
      - name: Install pinned Python tools
        run: python3 -m pip install -r requirements.txt
      - name: Install locked Node tools
        run: npm ci --prefix .standards/linters
      - name: Install pinned shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      - name: Run applicable linters
        run: python3 .standards/tools/standards.py --repo . --lint-only --lint-output lint-results.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: lint-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: lint-results.json
          if-no-files-found: warn

  standards:
    needs: lint
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.11'
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '24.21.0'
      - name: Pin npm version
        run: npm install --global npm@11.19.0
      - name: Install pinned Python tools
        run: python3 -m pip install -r requirements.txt
      - name: Install locked Node tools
        run: npm ci --prefix .standards/linters
      - name: Install pinned shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck shfmt
      - uses: actions/download-artifact@v8.0.1
        if: always()
        continue-on-error: true
        with:
          name: lint-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports
      - name: Run standards and setup behavior checks
        if: always()
        run: >-
          python3 .standards/tools/standards.py --repo .
          --lint-report reports/lint-results.json
          --json-out standards-report.json
          --github-summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: standards-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: standards-report.json
          if-no-files-found: warn
