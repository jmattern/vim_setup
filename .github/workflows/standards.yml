name: standards

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vim_setup
    steps:
      - uses: actions/checkout@v4
        with:
          path: vim_setup
      - uses: actions/checkout@v4
        with:
          repository: jmattern/common-standards
          ref: 1bdfb52e0c72b37c5c2acca5db2e8a87b43f87c5
          path: common-standards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck=0.9.0-1 shfmt=3.8.0-1
      - run: test "$(shellcheck --version | awk '/^version:/ {print $2}')" = "0.9.0"
      - run: test "$(shfmt --version)" = "v3.8.0"
      - run: python -m pip install -r ../common-standards/requirements.txt yamllint==1.38.0
      - run: npm ci --prefix linters
      - run: >-
          python ../common-standards/tools/standards.py --repo . --lint-only
          --lint-output lint-results.json
          --github-summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        run: >-
          shellcheck --rcfile=linters/.shellcheckrc
          .vim/download_plugins .vim/update_vim
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: vim_setup/lint-results.json
          if-no-files-found: ignore

  standards:
    if: always()
    needs: [lint]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: vim_setup
    steps:
      - uses: actions/checkout@v4
        with:
          path: vim_setup
      - uses: actions/checkout@v4
        with:
          repository: jmattern/common-standards
          ref: 1bdfb52e0c72b37c5c2acca5db2e8a87b43f87c5
          path: common-standards
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y shellcheck=0.9.0-1 shfmt=3.8.0-1
      - run: test "$(shellcheck --version | awk '/^version:/ {print $2}')" = "0.9.0"
      - run: test "$(shfmt --version)" = "v3.8.0"
      - run: python -m pip install -r ../common-standards/requirements.txt yamllint==1.38.0
      - run: npm ci --prefix linters
      - if: always()
        uses: actions/download-artifact@v4
        with:
          name: lint-results
          path: vim_setup/artifacts
        continue-on-error: true
      - run: mkdir -p artifacts
      - run: >-
          VIM_SETUP_SKIP_SHELLCHECK=true python ../common-standards/tools/standards.py --repo .
          --lint-report artifacts/lint-results.json
          --json-out artifacts/standards-report.json
          --github-summary "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standards-report
          path: vim_setup/artifacts/standards-report.json
          if-no-files-found: ignore
